<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC English Grammar Quiz</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">

    <!-- Firebase SDKs (compat for easy namespaced usage) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
    </script>

    <style>
        :root {
            --primary: #5b5fe3;
            --primary-dark: #4a4ec9;
            --secondary: #8b5cf6;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #e8ecf4 0%, #dce3f0 25%, #eef1f8 50%, #e4e9f5 75%, #f0f4f8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background orbs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 20s ease-in-out infinite;
        }
        body::before {
            width: 350px;
            height: 350px;
            background: #c4b5fd;
            top: -80px;
            left: -100px;
        }
        body::after {
            width: 300px;
            height: 300px;
            background: #a5d8ff;
            bottom: -90px;
            right: -80px;
            animation-delay: -10s;
        }
        @keyframes floatOrb {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -40px) scale(1.1);
            }
            50% {
                transform: translate(-20px, 25px) scale(0.9);
            }
            75% {
                transform: translate(-35px, -20px) scale(1.05);
            }
        }

        /* App Container */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 540px;
            background: var(--card);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            transition: all var(--transition);
            min-height: 520px;
            display: flex;
            flex-direction: column;
        }

        /* Screen management */
        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 28px 24px 24px;
            animation: fadeSlideIn 0.4s ease-out;
        }
        .screen.active {
            display: flex;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============ START SCREEN ============ */
        .start-screen {
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            padding: 40px 28px;
        }
        .logo-icon {
            font-size: 64px;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-18px);
            }
            60% {
                transform: translateY(-6px);
            }
        }
        .start-screen h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .start-screen .subtitle {
            font-size: 0.95rem;
            color: var(--text-light);
            max-width: 340px;
            line-height: 1.5;
        }
        .info-cards {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 380px;
        }
        .info-card {
            flex: 1;
            min-width: 100px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 12px;
            text-align: center;
        }
        .info-card .icon {
            font-size: 26px;
            margin-bottom: 4px;
        }
        .info-card .label {
            font-size: 0.78rem;
            color: var(--text-light);
            font-weight: 500;
        }
        .info-card .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            font-family: var(--font);
            letter-spacing: 0.01em;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.96);
            transition: transform 0.1s;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            box-shadow: 0 4px 15px rgba(91, 95, 227, 0.35);
            font-size: 1.05rem;
            padding: 15px 40px;
        }
        .btn-primary:hover {
            box-shadow: 0 6px 22px rgba(91, 95, 227, 0.45);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: #f5f3ff;
        }
        .btn-sm {
            padding: 10px 20px;
            font-size: 0.88rem;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ============ QUIZ SCREEN ============ */
        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 12px;
        }
        .question-counter {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary);
            background: #eef0ff;
            padding: 6px 14px;
            border-radius: 50px;
            white-space: nowrap;
        }
        .timer-display {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
            background: #f8fafc;
            padding: 6px 14px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: color 0.3s;
        }
        .timer-display.urgent {
            color: var(--danger);
            animation: pulse 0.6s ease-in-out infinite;
        }
        .timer-display.warning {
            color: var(--warning);
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .timer-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            transition: background 0.3s;
        }
        .timer-bar-container {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .timer-bar {
            height: 100%;
            border-radius: 10px;
            background: var(--success);
            transition: width 0.1s linear, background 0.4s;
            width: 100%;
        }
        .timer-bar.warning {
            background: var(--warning);
        }
        .timer-bar.danger {
            background: var(--danger);
        }
        .progress-dots {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            justify-content: center;
        }
        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e5e7eb;
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .progress-dot.done {
            background: var(--success);
            transform: scale(1.1);
        }
        .progress-dot.wrong-dot {
            background: var(--danger);
            transform: scale(1.1);
        }
        .progress-dot.current {
            background: var(--primary);
            box-shadow: 0 0 0 4px rgba(91, 95, 227, 0.2);
            transform: scale(1.3);
            animation: dotPulse 1.5s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,
            100% {
                box-shadow: 0 0 0 4px rgba(91, 95, 227, 0.2);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(91, 95, 227, 0);
            }
        }
        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.55;
            color: var(--text);
            margin-bottom: 20px;
            padding: 16px 18px;
            background: #fafbfc;
            border-radius: var(--radius);
            border-left: 4px solid var(--primary);
            letter-spacing: 0.01em;
            min-height: 60px;
            display: flex;
            align-items: center;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            list-style: none;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: #fff;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: var(--font);
            text-align: left;
            transition: all var(--transition);
            font-weight: 500;
            color: var(--text);
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .option-btn:hover {
            border-color: #c4c8f0;
            background: #fafaff;
            transform: translateX(2px);
        }
        .option-btn:active {
            transform: scale(0.985);
            transition: transform 0.08s;
        }
        .option-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all var(--transition);
            color: var(--text-light);
        }
        .option-btn:hover .option-letter {
            background: #e0e4f5;
            color: var(--primary);
        }
        .option-btn.correct {
            border-color: var(--success) !important;
            background: var(--success-light) !important;
            animation: correctPop 0.5s ease-out;
        }
        .option-btn.correct .option-letter {
            background: var(--success);
            color: #fff;
        }
        .option-btn.wrong {
            border-color: var(--danger) !important;
            background: var(--danger-light) !important;
            animation: shake 0.5s ease-out;
        }
        .option-btn.wrong .option-letter {
            background: var(--danger);
            color: #fff;
        }
        .option-btn.reveal-correct {
            border-color: var(--success) !important;
            background: #f0fdf6 !important;
        }
        .option-btn.reveal-correct .option-letter {
            background: var(--success);
            color: #fff;
        }
        @keyframes correctPop {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.03);
            }
            100% {
                transform: scale(1);
            }
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .option-btn.disabled:hover {
            transform: none;
            border-color: var(--border);
            background: #fff;
        }

        /* ============ RESULT SCREEN ============ */
        .result-screen {
            align-items: center;
            text-align: center;
            gap: 16px;
            padding: 30px 24px 24px;
        }
        .result-emoji {
            font-size: 60px;
            animation: bounce 1.5s ease-in-out;
        }
        .score-circle {
            position: relative;
            width: 140px;
            height: 140px;
            flex-shrink: 0;
        }
        .score-circle svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .score-circle .bg-ring {
            fill: none;
            stroke: #e5e7eb;
            stroke-width: 10;
        }
        .score-circle .progress-ring {
            fill: none;
            stroke: var(--success);
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .score-circle .score-text {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 2.4rem;
            color: var(--text);
            line-height: 1;
        }
        .score-circle .score-text small {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-light);
            display: block;
        }
        .result-message {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            max-width: 320px;
        }
        .result-detail {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .name-input-group {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 300px;
        }
        .name-input {
            flex: 1;
            padding: 11px 16px;
            border-radius: 50px;
            border: 2px solid var(--border);
            font-size: 0.9rem;
            font-family: var(--font);
            outline: none;
            transition: all var(--transition);
            background: #fafbfc;
        }
        .name-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 95, 227, 0.1);
            background: #fff;
        }
        .save-status {
            font-size: 0.82rem;
            font-weight: 500;
            min-height: 20px;
            transition: all var(--transition);
        }
        .save-status.success {
            color: var(--success);
        }
        .save-status.error {
            color: var(--danger);
        }
        .result-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 360px;
        }

        /* ============ LEADERBOARD SCREEN ============ */
        .leaderboard-screen {
            gap: 16px;
            padding: 20px 20px 24px;
        }
        .leaderboard-screen h2 {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
        }
        .leaderboard-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 4px;
        }
        .leaderboard-list::-webkit-scrollbar {
            width: 5px;
        }
        .leaderboard-list::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            background: #f8fafc;
            border: 1px solid var(--border);
            transition: all var(--transition);
        }
        .leaderboard-item.top-1 {
            background: #fffbeb;
            border-color: #fcd34d;
        }
        .leaderboard-item.top-2 {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
        .leaderboard-item.top-3 {
            background: #fdf6f0;
            border-color: #fbbf8c;
        }
        .rank-badge {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            flex-shrink: 0;
            background: #e5e7eb;
            color: var(--text-light);
        }
        .rank-badge.gold {
            background: #fbbf24;
            color: #7c5e00;
            font-size: 1.1rem;
        }
        .rank-badge.silver {
            background: #cbd5e1;
            color: #475569;
            font-size: 1.1rem;
        }
        .rank-badge.bronze {
            background: #f9a87a;
            color: #7c3a1d;
            font-size: 1.1rem;
        }
        .leaderboard-info {
            flex: 1;
            min-width: 0;
        }
        .leaderboard-name {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .leaderboard-date {
            font-size: 0.73rem;
            color: var(--text-muted);
        }
        .leaderboard-score {
            font-weight: 700;
            font-size: 1rem;
            color: var(--primary);
            flex-shrink: 0;
        }
        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 0.95rem;
        }
        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============ TOAST ============ */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #1e293b;
            color: #fff;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 500;
            z-index: 99;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-lg);
            font-family: var(--font);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            .app-container {
                border-radius: var(--radius-lg);
                min-height: auto;
            }
            .screen {
                padding: 20px 16px 18px;
            }
            .start-screen {
                padding: 30px 16px;
                gap: 14px;
            }
            .start-screen h1 {
                font-size: 1.5rem;
            }
            .start-screen .subtitle {
                font-size: 0.85rem;
            }
            .question-text {
                font-size: 1rem;
                padding: 12px 14px;
            }
            .option-btn {
                padding: 12px 14px;
                font-size: 0.9rem;
                gap: 10px;
            }
            .option-letter {
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
            }
            .btn {
                padding: 12px 24px;
                font-size: 0.9rem;
            }
            .btn-primary {
                padding: 14px 30px;
                font-size: 0.95rem;
            }
            .info-cards {
                gap: 8px;
            }
            .info-card {
                padding: 10px 8px;
            }
            .info-card .icon {
                font-size: 22px;
            }
            .info-card .value {
                font-size: 0.95rem;
            }
            .score-circle {
                width: 110px;
                height: 110px;
            }
            .score-circle .score-text {
                font-size: 2rem;
            }
            .progress-dots {
                gap: 3px;
            }
            .progress-dot {
                width: 7px;
                height: 7px;
            }
            .result-buttons {
                gap: 8px;
            }
            .result-buttons .btn {
                font-size: 0.82rem;
                padding: 10px 16px;
            }
            .name-input-group {
                flex-direction: column;
                gap: 6px;
            }
        }
        @media (max-width: 360px) {
            .screen {
                padding: 16px 10px 14px;
            }
            .question-text {
                font-size: 0.9rem;
            }
            .option-btn {
                padding: 10px 12px;
                font-size: 0.82rem;
            }
            .option-letter {
                width: 26px;
                height: 26px;
                font-size: 0.72rem;
            }
            .btn {
                font-size: 0.82rem;
                padding: 10px 18px;
            }
            .btn-primary {
                font-size: 0.9rem;
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- ========== START SCREEN ========== -->
        <div class="screen active" id="startScreen">
            <div class="logo-icon">📝</div>
            <h1>SSC English Grammar Quiz</h1>
            <p class="subtitle">Test your English grammar skills with 25 MCQs based on SSC exam pattern.</p>

            // ==================== QUESTIONS DATA ====================

                ],
                correct: 1,
                explanation: 'It means to waste time regretting something that has already happened and cannot be changed.'
            }, {
                id: 22,
                question: 'Choose the correct preposition: "He is addicted _____ social media."',
                options: ['with', 'to', 'for', 'at'],
                correct: 1,
                explanation: '"Addicted to" is the standard collocation.'
            }, {
                id: 23,
                question: 'Convert to active voice: "The cake was eaten by the children."',
                options: [
                    'The children ate the cake.',
                    'The children eat the cake.',
                    'The children have eaten the cake.',
                    'The cake the children ate.'
                ],
                correct: 0,
                explanation: 'Past simple passive → past simple active: subject and object swap, verb form changes.'
            }, {
                id: 24,
                question: 'Choose the correct word: "The news _____ not good today."',
                options: ['is', 'are', 'were', 'have been'],
                correct: 0,
                explanation: '"News" is an uncountable noun and takes a singular verb "is".'
            }, {
                id: 25,
                question: 'Rearrange the sentence: P: the examination / Q: he / R: with flying colours / S: passed',
                options: ['Q-S-R-P', 'Q-P-S-R', 'S-R-Q-P', 'Q-S-P-R'],
                correct: 0,
                explanation: '"He passed the examination with flying colours" — Subject + Verb + Object + Adverbial phrase.'
            }];

            // ==================== SCREEN NAVIGATION ====================
            function showScreen(screenName) {
                Object.values(screens).forEach(s => s.classList.remove('active'));
                if (screens[screenName]) {
                    screens[screenName].classList.add('active');
                    // Re-trigger animation
                    screens[screenName].style.animation = 'none';
                    screens[screenName].offsetHeight;
                    screens[screenName].style.animation = '';
                }
            }

            // ==================== TOAST ====================
            let toastTimeout;

            function showToast(message, duration = 2500) {
                clearTimeout(toastTimeout);
                els.toast.textContent = message;
                els.toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    els.toast.classList.remove('show');
                }, duration);
            }

            // ==================== QUIZ LOGIC ====================
            function resetState() {
                state.currentIndex = 0;
                state.score = 0;
                state.answers = [];
                state.timeLeft = TIME_PER_QUESTION;
                state.timerInterval = null;
                state.questionStartTime = 0;
                state.quizFinished = false;
                state.totalTimeTaken = 0;
                state.isAnswerLocked = false;
            }

            function buildProgressDots() {
                els.progressDots.innerHTML = '';
                for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                    const dot = document.createElement('span');
                    dot.classList.add('progress-dot');
                    if (i < state.answers.length) {
                        dot.classList.add(state.answers[i].isCorrect ? 'done' : 'wrong-dot');
                    } else if (i === state.currentIndex && !state.quizFinished) {
                        dot.classList.add('current');
                    }
                    dot.title = `Q${i + 1}`;
                    els.progressDots.appendChild(dot);
                }
            }

            function loadQuestion() {
                if (state.currentIndex >= TOTAL_QUESTIONS) {
                    finishQuiz();
                    return;
                }
                state.isAnswerLocked = false;
                state.timeLeft = TIME_PER_QUESTION;
                state.questionStartTime = Date.now();
                const q = questions[state.currentIndex];

                els.questionCounter.textContent = `Q ${state.currentIndex + 1}/${TOTAL_QUESTIONS}`;
                els.questionText.textContent = q.question;
                els.optionsList.innerHTML = '';

                const letters = ['A', 'B', 'C', 'D'];
                q.options.forEach((opt, idx) => {
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.classList.add('option-btn');
                    btn.innerHTML = `
                <span class="option-letter">${letters[idx]}</span>
                <span>${opt}</span>
              `;
                    btn.addEventListener('click', () => handleOptionClick(idx, btn));
                    btn.setAttribute('aria-label', `Option ${letters[idx]}: ${opt}`);
                    li.appendChild(btn);
                    els.optionsList.appendChild(li);
                });

                // Reset timer visuals
                els.timerBar.classList.remove('warning', 'danger');
                els.timerBar.style.width = '100%';
                els.timerDisplay.classList.remove('warning', 'urgent');
                els.timerText.textContent = `${TIME_PER_QUESTION}s`;
                updateTimerDot(TIME_PER_QUESTION);

                buildProgressDots();
                startTimer();
            }

            function updateTimerDot(secondsLeft) {
                const dot = els.timerDisplay.querySelector('.timer-dot');
                if (secondsLeft <= 5) {
                    dot.style.background = '#ef4444';
                } else if (secondsLeft <= 10) {
                    dot.style.background = '#f59e0b';
                } else {
                    dot.style.background = '#10b981';
                }
            }

            function startTimer() {
                clearInterval(state.timerInterval);
                state.timeLeft = TIME_PER_QUESTION;
                state.questionStartTime = Date.now();
                els.timerBar.style.width = '100%';
                els.timerBar.classList.remove('warning', 'danger');
                els.timerDisplay.classList.remove('warning', 'urgent');
                els.timerText.textContent = `${TIME_PER_QUESTION}s`;
                updateTimerDot(TIME_PER_QUESTION);

                state.timerInterval = setInterval(() => {
                    const elapsed = (Date.now() - state.questionStartTime) / 1000;
                    const remaining = Math.max(0, TIME_PER_QUESTION - elapsed);
                    state.timeLeft = remaining;
                    const pct = (remaining / TIME_PER_QUESTION) * 100;
                    els.timerBar.style.width = `${pct}%`;
                    els.timerText.textContent = `${Math.ceil(remaining)}s`;
                    updateTimerDot(Math.ceil(remaining));

                    // Color transitions
                    els.timerBar.classList.remove('warning', 'danger');
                    els.timerDisplay.classList.remove('warning', 'urgent');
                    if (remaining <= 5) {
                        els.timerBar.classList.add('danger');
                        els.timerDisplay.classList.add('urgent');
                    } else if (remaining <= 10) {
                        els.timerBar.classList.add('warning');
                        els.timerDisplay.classList.add('warning');
                    }

                    if (remaining <= 0) {
                        handleTimeout();
                    }
                }, 100);
            }

            function stopTimer() {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }

            function handleTimeout() {
                if (state.isAnswerLocked) return;
                state.isAnswerLocked = true;
                stopTimer();
                const q = questions[state.currentIndex];
                const allBtns = els.optionsList.querySelectorAll('.option-btn');

                // Mark all disabled
                allBtns.forEach(b => b.classList.add('disabled'));
                // Reveal correct answer
                allBtns[q.correct].classList.add('reveal-correct');

                // Record as incorrect (unanswered)
                state.answers.push({
                    selectedIndex: -1,
                    correctIndex: q.correct,
                    isCorrect: false,
                });
                state.totalTimeTaken += TIME_PER_QUESTION;

                buildProgressDots();
                setTimeout(() => advanceQuestion(), 900);
            }

            function handleOptionClick(selectedIndex, clickedBtn) {
                if (state.isAnswerLocked) return;
                state.isAnswerLocked = true;
                stopTimer();

                const q = questions[state.currentIndex];
                const isCorrect = selectedIndex === q.correct;
                const allBtns = els.optionsList.querySelectorAll('.option-btn');
                const elapsed = (Date.now() - state.questionStartTime) / 1000;
                state.totalTimeTaken += Math.min(elapsed, TIME_PER_QUESTION);

                // Disable all buttons
                allBtns.forEach(b => b.classList.add('disabled'));

                // Highlight correct answer
                allBtns[q.correct].classList.add('correct');

                // Highlight user's choice
                if (isCorrect) {
                    state.score++;
                    clickedBtn.classList.add('correct');
                } else {
                    clickedBtn.classList.add('wrong');
                    // Also subtly highlight the correct one more
                    allBtns[q.correct].classList.add('reveal-correct');
                }

                state.answers.push({
                    selectedIndex,
                    correctIndex: q.correct,
                    isCorrect,
                });

                buildProgressDots();
                const delay = isCorrect ? 700 : 1000;
                setTimeout(() => advanceQuestion(), delay);
            }

            function advanceQuestion() {
                state.currentIndex++;
                if (state.currentIndex >= TOTAL_QUESTIONS) {
                    finishQuiz();
                } else {
                    loadQuestion();
                }
            }

            function finishQuiz() {
                stopTimer();
                state.quizFinished = true;
                buildProgressDots();
                showResults();
            }

            // ==================== RESULTS ====================
            function showResults() {
                showScreen('result');
                const percentage = Math.round((state.score / TOTAL_QUESTIONS) * 100);
                const offset = CIRCUMFERENCE - (percentage / 100) * CIRCUMFERENCE;

                // Animate the ring
                els.resultRing.style.strokeDasharray = CIRCUMFERENCE;
                els.resultRing.style.strokeDashoffset = CIRCUMFERENCE;
                // Set color based on score
                let ringColor = '#ef4444';
                if (percentage >= 80) ringColor = '#10b981';
                else if (percentage >= 60) ringColor = '#f59e0b';
                else if (percentage >= 40) ringColor = '#f97316';
                els.resultRing.style.stroke = ringColor;

                // Trigger animation
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        els.resultRing.style.strokeDashoffset = offset;
                    });
                });

                // Animate score count
                animateCount(els.resultScore, 0, state.score, 1000);

                // Emoji and message
                let emoji, message;
                if (percentage >= 90) {
                    emoji = '🏆';
                    message = 'Outstanding! You\'re a grammar master!';
                } else if (percentage >= 75) {
                    emoji = '🌟';
                    message = 'Excellent work! Keep it up!';
                } else if (percentage >= 60) {
                    emoji = '👍';
                    message = 'Good job! Room for improvement.';
                } else if (percentage >= 40) {
                    emoji = '📚';
                    message = 'Fair attempt. More practice needed.';
                } else {
                    emoji = '💪';
                    message = 'Keep learning! Practice makes perfect.';
                }
                els.resultEmoji.textContent = emoji;
                els.resultMessage.textContent = message;
                els.resultDetail.textContent =
                    `You scored ${state.score} out of ${TOTAL_QUESTIONS} (${percentage}%) in ${formatTime(state.totalTimeTaken)}.`;
                els.saveStatus.textContent = '';
                els.nameInput.value = localStorage.getItem('quizPlayerName') || '';
            }

            function animateCount(element, start, end, duration) {
                const startTime = performance.now();
                function update(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
                    element.textContent = Math.round(start + (end - start) * eased);
                    if (progress < 1) {
                        requestAnimationFrame(update);
                    } else {
                        element.textContent = end;
                    }
                }
                requestAnimationFrame(update);
            }

            function formatTime(totalSeconds) {
                const mins = Math.floor(totalSeconds / 60);
                const secs = Math.floor(totalSeconds % 60);
                if (mins > 0) {
                    return `${mins}m ${secs}s`;
                }
                return `${secs}s`;
            }

            // ==================== FIREBASE OPERATIONS ====================
            function saveScoreToFirebase(playerName) {
                if (!firebaseReady || !db) {
                    els.saveStatus.textContent = '⚠️ Firebase not connected. Score saved locally.';
                    els.saveStatus.className = 'save-status error';
                    return Promise.reject(new Error('Firebase not connected'));
                }
                const percentage = Math.round((state.score / TOTAL_QUESTIONS) * 100);
                const data = {
                    name: playerName || 'Anonymous',
                    score: state.score,
                    total: TOTAL_QUESTIONS,
                    percentage: percentage,
                    timeTaken: Math.round(state.totalTimeTaken),
                    timestamp: new Date().toISOString(),
                };
                return db.ref('quizResults').push(data);
            }

            function fetchLeaderboard() {
                if (!firebaseReady || !db) {
                    return Promise.resolve([]);
                }
                return db.ref('quizResults')
                    .orderByChild('percentage')
                    .limitToLast(50)
                    .once('value')
                    .then(snapshot => {
                        const results = [];
                        snapshot.forEach(child => {
                            results.push({ id: child.key, ...child.val() });
                        });
                        // Sort descending by percentage, then by score
                        results.sort((a, b) => {
                            if (b.percentage !== a.percentage) return b.percentage - a.percentage;
                            return b.score - a.score;
                        });
                        return results.slice(0, 20);
                    });
            }

            // ==================== EVENT HANDLERS ====================
            els.btnStart.addEventListener('click', () => {
                resetState();
                showScreen('quiz');
                loadQuestion();
            });

            els.btnRetry.addEventListener('click', () => {
                resetState();
                showScreen('quiz');
                loadQuestion();
                els.saveStatus.textContent = '';
                els.saveStatus.className = 'save-status';
            });

            els.btnViewLeaderboard.addEventListener('click', () => {
                showScreen('leaderboard');
                loadLeaderboard();
            });

            els.btnResultLeaderboard.addEventListener('click', () => {
                showScreen('leaderboard');
                loadLeaderboard();
            });

            els.btnBackFromLeaderboard.addEventListener('click', () => {
                if (state.quizFinished) {
                    showScreen('result');
                } else {
                    showScreen('start');
                }
            });

            els.btnSaveScore.addEventListener('click', async () => {
                if (!state.quizFinished) {
                    showToast('Finish the quiz first!');
                    return;
                }
                const playerName = els.nameInput.value.trim() || 'Anonymous';
                localStorage.setItem('quizPlayerName', playerName);
                els.btnSaveScore.disabled = true;
                els.saveStatus.textContent = 'Saving...';
                els.saveStatus.className = 'save-status';

                try {
                    await saveScoreToFirebase(playerName);
                    els.saveStatus.textContent = '✅ Score saved successfully!';
                    els.saveStatus.className = 'save-status success';
                    showToast('Score saved! 🎉');
                } catch (err) {
                    console.error('Save error:', err);
                    els.saveStatus.textContent =
                        '⚠️ Could not save to Firebase. Check your connection or database rules.';
                    els.saveStatus.className = 'save-status error';
                    showToast('Save failed. Check connection.');
                } finally {
                    els.btnSaveScore.disabled = false;
                }
            });

            function loadLeaderboard() {
                els.leaderboardList.innerHTML = '';
                els.leaderboardEmpty.style.display = 'none';
                els.leaderboardSpinner.style.display = 'block';

                fetchLeaderboard().then(results => {
                    els.leaderboardSpinner.style.display = 'none';
                    if (!results || results.length === 0) {
                        els.leaderboardEmpty.style.display = 'block';
                        return;
                    }
                    results.forEach((entry, index) => {
                        const li = document.createElement('li');
                        li.classList.add('leaderboard-item');
                        const rank = index + 1;
                        if (rank === 1) li.classList.add('top-1');
                        if (rank === 2) li.classList.add('top-2');
                        if (rank === 3) li.classList.add('top-3');

                        let badgeClass = '';
                        let rankIcon = rank;
                        if (rank === 1) { badgeClass = 'gold';
                            rankIcon = '🥇'; } else if (rank === 2) { badgeClass = 'silver';
                            rankIcon = '🥈'; } else if (rank === 3) { badgeClass = 'bronze';
                            rankIcon = '🥉'; }

                        const dateStr = entry.timestamp ?
                            new Date(entry.timestamp).toLocaleDateString('en-IN', {
                                day: 'numeric',
                                month: 'short',
                                year: '2-digit'
                            }) :
                            'N/A';

                        li.innerHTML = `
                  <span class="rank-badge ${badgeClass}">${rankIcon}</span>
                  <div class="leaderboard-info">
                    <span class="leaderboard-name">${escapeHTML(entry.name || 'Anonymous')}</span>
                    <span class="leaderboard-date">${dateStr}</span>
                  </div>
                  <span class="leaderboard-score">${entry.score}/${entry.total} (${entry.percentage}%)</span>
                `;
                        els.leaderboardList.appendChild(li);
                    });
                }).catch(err => {
                    console.error('Leaderboard fetch error:', err);
                    els.leaderboardSpinner.style.display = 'none';
                    els.leaderboardEmpty.style.display = 'block';
                    els.leaderboardEmpty.textContent =
                        '⚠️ Could not load leaderboard. Check Firebase connection.';
                    showToast('Failed to load leaderboard');
                });
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ==================== INITIALIZATION ====================
            function init() {
                showScreen('start');
                els.resultRing.style.strokeDasharray = CIRCUMFERENCE;
                els.resultRing.style.strokeDashoffset = CIRCUMFERENCE;
                els.resultScore.textContent = '0';
                els.nameInput.value = localStorage.getItem('quizPlayerName') || '';
                console.log('📝 SSC English Grammar Quiz App Ready');
                console.log('🔥 Firebase Status:', firebaseReady ? 'Connected ✅' : 'Offline ⚠️');
                console.log('📋 Total Questions:', TOTAL_QUESTIONS);
                console.log('⏱️ Time per question:', TIME_PER_QUESTION + 's');
                if (!firebaseReady) {
                    console.log('💡 Tip: Quiz works offline. Enable Firebase for leaderboard & score saving.');
                    console.log('💡 Ensure Firebase Realtime Database rules allow read/write.');
                }
            }

            init();
        })();
    </script>
</body>
</html>
